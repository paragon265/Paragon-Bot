services:
  - type: web
    name: bitget-mtf-demo-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.10
      - key: SCAN_TOKEN
        generateValue: true
      - key: BITGET_API_KEY
        sync: false
      - key: BITGET_API_SECRET
        sync: false
      - key: BITGET_API_PASSPHRASE
        sync: false
      - key: SYMBOLS
        value: BTC/USDT:USDT,ETH/USDT:USDT
      - key: MARGIN_MODE
        value: isolated
      - key: LEVERAGE
        value: "5"
      - key: RISK_PCT
        value: "1.0"
      - key: MIN_RR
        value: "1.5"
      - key: MAX_OPEN_POSITIONS
        value: "2"
      - key: AUTO_TRADE
        value: "false"
